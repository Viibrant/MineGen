# Advanced MineGen Configuration for Large-Scale Training

model:
  device: "auto"
  num_classes: 20
  latent_dim: 128
  embedding_size: 1024
  hidden_dim: 512
  num_heads: 16
  num_layers: 24
  patch_size: 4

solver:
  optimizer_name: "AdamW"
  base_lr: 0.0001
  weight_decay: 0.01
  momentum: 0.9
  bias_lr_factor: 1.0
  weight_decay_bias: 0.0
  max_epochs: 500
  log_period: 5
  checkpoint_period: 25

datasets:
  data_dir: "schematics"
  metadata_file: "data.csv"
  shape: [32, 32, 32]
  threshold: 64
  train_split: 0.85
  val_split: 0.1

dataloader:
  batch_size: 16
  num_workers: 8
  pin_memory: true
  shuffle: true

scraper:
  criteria: "top-rated"
  num_pages: 50
  max_workers: 20
  schematics_dir: "schematics"
  errors_file: ".errors.log"
  cred_file: ".credentials.yml"

dashboard:
  host: "0.0.0.0"
  port: 8050
  debug: false
  auto_refresh: 3

output_dir: "./outputs/advanced_training"
seed: 42